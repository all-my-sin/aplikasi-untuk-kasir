# Fixed project name so moving/renaming the folder never orphans the database.
name: retail-pos

services:
  db:
    image: postgres:16-alpine
    container_name: retail-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_dev_password
      POSTGRES_DB: pos
    ports:
      - "5433:5432"
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pos_pgdata:
